<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions — HomeworkSubmit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">HomeworkSubmit</a>
            <div class="nav-links">
                <a href="/">Submit</a>
                <a href="submissions.html" class="active">View All</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Submissions</h1>
            <button class="clear-btn" id="clear-all">Clear All</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="sub-count">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="subject-count">0</div>
                <div class="stat-label">Subjects</div>
            </div>
        </div>

        <div id="submissions-list"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
